<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./output.css" rel="stylesheet" />
  <div class="bg my-4 flex h-10 w-full items-center justify-center rounded-md bg-white p-2 dark:bg-black">
    <h1 class="text-center font-mono font-extrabold text-black dark:text-white">Je moeder</h1>
  </div>
</head>
<body>
  <div class="bg-white dark:bg-black">
    <div class="h-16 snap-center rounded-full bg-red-500"></div>
    <div class="h-16 rounded-full bg-orange-500"></div>
    <div class="h-16 rounded-full bg-yellow-500"></div>
    <div class="h-16 rounded-full bg-green-500"></div>
    <div class="h-16 rounded-full bg-blue-500"></div>
    <div class="h-16 rounded-full bg-indigo-500"></div>
    <div class="h-16 rounded-full bg-violet-500"></div>
  </div>
  <div class="rounded-lgbg-white m-10 bg-white px-6 py-8 shadow-xl ring-1 ring-slate-900/5 dark:bg-black">
    <h3 class="text-base font-medium tracking-tight text-black dark:text-white">Writes Upside-Down</h3>
    <p class="mt-2 text-sm text-slate-500 dark:text-blue-100">The Zero Gravity Pen can be used to write in any orientation, including upside-down. It even works in outer space.</p>
    <button id="toggleDark" class="mt-8 rounded-md bg-blue-100 px-4 py-2 text-sm font-medium text-blue-900" onclick="document.body.classList.toggle('dark')">FLASHBANG</button>
  </div>

  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
      const toggleDark = document.getElementById('toggleDark')
      toggleDark.addEventListener('click', function () {
        if (document.documentElement.classList.includes('dark')) {
          document.documentElement.classList.remove('dark')
        }
        else {
          document.documentElement.classList.add('dark')
        }
        alert("click!")
      });
    });
  </script>
</body>
