<!-- Add this script at the very beginning to prevent flash of light mode -->
<script>
  // Check for saved preference or system preference
  if (localStorage.theme === 'dark' ||
    (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
</script>

  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
      const toggleDark = document.getElementById('toggleDark');
      const darkModeSound = document.getElementById('darkModeSound');

      toggleDark.addEventListener('click', function () {
        // Check current mode before toggle
        const isDarkMode = document.documentElement.classList.contains('dark');

        // Toggle the dark class on the html element
        document.documentElement.classList.toggle('dark');

        // Play appropriate sound based on the mode we're switching TO
        if (document.documentElement.classList.contains('dark') == false) {
          // Playing darkModeSound (switching to dark)
          darkModeSound.currentTime = 0;
          darkModeSound.volume = 0.1;
          darkModeSound.play().catch(e => console.log("Sound play failed:", e));
          localStorage.theme = 'dark';
        }

        console.log("Dark mode toggled:", document.documentElement.classList.contains('dark'));
      });
    });
  </script>
